name: Build Sega Mega Drive ROM

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'megadrive/**'
      - 'scripts/export-md-assets.mjs'
      - 'scripts/export-md-vgm.mjs'
      - '.github/workflows/megadrive-rom.yml'
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate 4bpp Mega Drive PNG sprites, YM2612 VGM music & PCM SFX
        run: |
          node scripts/export-md-assets.mjs
          node scripts/export-md-vgm.mjs
          mkdir -p megadrive/inc megadrive/out

      - name: Compile Sega Mega Drive 16-bit ROM with official SGDK container
        run: |
          docker run --rm --user 0:0 \
            -v "${{ github.workspace }}/megadrive:/src" \
            -w /src \
            --entrypoint /bin/sh \
            ghcr.io/stephane-d/sgdk:latest \
            -c '
              set -eu
              GDK_DIR="${GDK:-/sgdk}"
              if [ ! -f "$GDK_DIR/makefile.gen" ]; then
                for d in /sgdk /gdk /opt/sgdk /m68k/sgdk; do
                  if [ -f "$d/makefile.gen" ]; then
                    GDK_DIR="$d"
                    break
                  fi
                done
              fi
              echo "Using SGDK at: $GDK_DIR"
              GDK="$GDK_DIR" make -f "$GDK_DIR/makefile.gen"
            '
          sudo chown -R "$(id -u):$(id -g)" megadrive

      - name: Copy ROM binary for download
        run: |
          test -f megadrive/out/rom.bin
          cp megadrive/out/rom.bin green-beer-pizedes-md.bin
          ls -lh green-beer-pizedes-md.bin

      - name: Upload Sega Mega Drive ROM artifact
        uses: actions/upload-artifact@v5
        with:
          name: green-beer-pizedes-megadrive-rom
          path: green-beer-pizedes-md.bin
          retention-days: 30
