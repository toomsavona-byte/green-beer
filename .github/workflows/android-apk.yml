name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      server_url:
        description: 'VPS URL for Online 2P Co-Op (e.g. https://game.example.com) — optional'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_SERVER_URL: ${{ github.event.inputs.server_url || vars.VITE_SERVER_URL || '' }}
        run: npm run build

      - name: Add and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Enforce Landscape-Only Orientation, Immersive Fullscreen & Launcher Icons
        run: node scripts/configure-android.mjs

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk green-beer-pizedes.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: green-beer-pizedes-apk
          path: green-beer-pizedes.apk
          retention-days: 30
